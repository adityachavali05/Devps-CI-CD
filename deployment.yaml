apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-booking
  template:
    metadata:
      labels:
        app: campus-booking
    spec:
      containers:
        - name: campus-booking
          image: campuscicdacr.azurecr.io/campus-booking:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
