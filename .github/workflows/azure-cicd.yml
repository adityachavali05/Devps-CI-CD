name: Campus Booking - Azure CI/CD

on:
  push:
    branches:
      - feature/borrower-validation
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: campuscicdacr
  ACR_LOGIN_SERVER: campuscicdacr.azurecr.io
  IMAGE_NAME: campus-booking
  RESOURCE_GROUP: rg-campus-cicd
  AKS_CLUSTER: aks-campus-cicd

jobs:
  build-test-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build Docker image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" \
            .

      - name: Push Docker image to ACR
        run: |
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

      - name: Configure AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}
          admin: 'true'

      - name: Deploy updated image to AKS
        run: |
          kubectl set image deployment/campus-booking \
            campus-booking="$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/campus-booking --timeout=180s
          kubectl get pods
          kubectl get services
